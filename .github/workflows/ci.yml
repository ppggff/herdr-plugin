name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run unit tests
        working-directory: input-method-keeper
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        working-directory: input-method-keeper
        run: python -m compileall -q src scripts tests

      - name: Check shell syntax
        run: >-
          sh -n
          input-method-keeper/bin/ime-keeper
          input-method-keeper/bin/herdr-ime-helper
          input-method-keeper/bin/prepare-install
